name: MindCloud Verification

on:
  push:
    branches: ["main", "mindcloud/**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run local end-to-end and integration checks
        run: npm run verify
      - name: Smoke-test live production endpoints
        run: node scripts/verify-production.js
