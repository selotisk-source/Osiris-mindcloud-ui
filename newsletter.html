<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Briefing — MindCloud</title><style>
:root{--bg:#070a0f;--panel:#0d131c;--line:#253142;--text:#e7edf5;--muted:#8290a3;--accent:#79b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}a{color:var(--accent);text-decoration:none}h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:10px 0}.sub{color:var(--muted);max-width:800px}.issue{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin:22px 0}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.date,.tag{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:#101722;border:1px solid #223044;border-radius:10px;padding:16px}.card h3{margin:6px 0 8px}.card p{color:#b9c4d2}.meta{font-size:12px;color:var(--muted);border-top:1px solid #223044;padding-top:9px;margin-top:9px}.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}.pill{border:1px solid #2a3a4e;border-radius:999px;padding:4px 8px;color:#9aa9bb;font-size:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><header><div class="brand">MIND<span>CLOUD</span> / BRIEFING</div><a href="/">← Till MindCloud</a></header><div class="date">Redaktionellt flöde</div><h1>Briefing</h1><p class="sub">MindClouds löpande redaktionella lager för verksamheten: utveckling, kartläggning, forskning, nya spår och nästa steg.</p><section id="issues">Laddar…</section></div><script>
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const box=document.getElementById("issues");
async function getJson(path){
  const r=await fetch(path,{cache:"no-store",headers:{"accept":"application/json"}});
  if(!r.ok) throw new Error(path+" svarade HTTP "+r.status);
  const type=r.headers.get("content-type")||"";
  if(!type.includes("json")) throw new Error(path+" svarade inte med JSON (content-type: "+type+")");
  return r.json();
}
function render(d){
  if(!d||!Array.isArray(d.sections)) throw new Error("En briefingpost saknar sections-lista.");
  return '<article class="issue"><div class="head"><div><div class="date">'+e(d.date)+'</div><h2>'+e(d.title)+'</h2><p class="sub">'+e(d.subtitle)+'</p></div><div class="tag">'+e(d.status)+'</div></div><div class="grid">'+d.sections.map(s=>'<article class="card"><div class="tag">'+e(s.category)+'</div><h3>'+e(s.headline)+'</h3><p>'+e(s.text)+'</p><div class="meta"><b>Implikation:</b> '+e(s.implication)+'</div><div class="meta"><b>Bevisläge:</b> '+e(s.evidence)+'</div></article>').join("")+'</div><div class="pills">'+(d.editorial?.framework||[]).map(x=>'<span class="pill">'+e(x)+'</span>').join("")+'</div></article>';
}
(async()=>{
  try{
    box.textContent="Hämtar briefingarkivet…";
    const index=await getJson("/newsletters/index.json");
    if(!Array.isArray(index.issues)||!index.issues.length) throw new Error("Indexet innehåller inga briefingposter.");
    const docs=await Promise.all(index.issues.map(x=>getJson("/"+String(x.path||"").replace(/^\/+/, ""))));
    box.innerHTML=docs.map(render).join("");
    const note=document.createElement("p");
    note.className="date";
    note.textContent="Laddat "+docs.length+" briefingposter · senaste index "+e(index.today||"datum saknas");
    box.prepend(note);
  }catch(err){
    box.innerHTML='<article class="issue"><h2>Briefingen kunde inte laddas</h2><p>Det gick inte att hämta arkivets index eller en briefingpost. Fel: <code>'+e(err?.message||String(err))+'</code></p><p><a href="/newsletters/index.json">Testa briefingindexet direkt</a> · <a href="/api/runtime/status">Kontrollera MindClouds runtime</a></p><button id="retryBriefing" type="button">Försök igen</button></article>';
    document.getElementById("retryBriefing")?.addEventListener("click",()=>location.reload());
  }
})();
</script></body></html>
