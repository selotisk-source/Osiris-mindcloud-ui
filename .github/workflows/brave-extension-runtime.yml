name: Brave extension runtime test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brave-extension-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brave-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Brave from the official APT repository
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl
          sudo curl --fail --silent --show-error --location \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg \
            --output /usr/share/keyrings/brave-browser-archive-keyring.gpg
          sudo curl --fail --silent --show-error --location \
            https://brave-browser-apt-release.s3.brave.com/brave-browser.sources \
            --output /etc/apt/sources.list.d/brave-browser-release.sources
          sudo apt-get update
          sudo apt-get install --yes brave-browser
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium
      - name: Confirm actual Brave executable
        run: |
          test -x /usr/bin/brave-browser
          /usr/bin/brave-browser --version
      - name: Run Brave extension and Sensor Fabric browser tests
        env:
          BRAVE_EXECUTABLE_PATH: /usr/bin/brave-browser
        run: |
          xvfb-run -a node tests/extension/brave-extension-runtime.test.js
          xvfb-run -a node tests/extension/sensor-fabric-map-browser.test.js
