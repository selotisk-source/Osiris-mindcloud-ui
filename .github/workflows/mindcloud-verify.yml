name: MindCloud Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindcloud-production-verification
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke-test live production endpoints (explicit dispatch only)
        env:
          MINDCLOUD_REQUIRE_FULL_PRODUCTION_SMOKE: "true"
        run: node scripts/verify-production.js
