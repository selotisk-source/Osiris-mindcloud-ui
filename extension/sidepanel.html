<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindCloud Split Screen</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#e7edf5;font:13px system-ui,sans-serif}header{padding:12px;border-bottom:1px solid #253142;font-weight:700;letter-spacing:.08em}header span{color:#79b8ff}.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:calc(100vh - 45px);gap:6px;padding:6px}.station{border:1px solid #253142;border-radius:8px;background:#0d131c;overflow:hidden}.head{padding:8px;border-bottom:1px solid #253142;font-weight:650}.body{height:calc(100% - 37px);padding:8px}.tool{display:block;width:100%;margin:5px 0;padding:8px;border:1px solid #253142;border-radius:6px;background:#101722;color:#e7edf5;text-align:left}.muted{color:#8290a3;font-size:11px}</style></head><body><header>MIND<span>CLOUD</span> · SPLIT SCREEN</header><main class="grid">
<div class="station"><div class="head">MindCore · Coordinator</div><div class="body"><div>Routing / convergence</div><p class="muted">Drag modules into stations in the full MindCloud workspace.</p></div></div>
<div class="station"><div class="head">GEO / Heritage</div><div class="body"><div>Map → place → object → evidence</div></div></div>
<div class="station"><div class="head">Sensor Fabric</div><div class="body"><div>Live media / sensor sources</div></div></div>
<div class="station"><div class="head">Research / Work</div><div class="body"><button class="tool" id="open">Open MindCloud</button></div></div>
</main><script>document.getElementById('open').onclick=()=>chrome.tabs.create({url:'https://osiris-mindcloud-ui-production.up.railway.app'});</script></body></html>
