name: MindCloud Runtime Verification

on:
  push:
    branches: [main, "mindcloud/sensor-fabric-brave-release-fullverify-20261014", "mindcloud/sensor-fabric-brave-release-ready-20261014"]
  pull_request:
    branches: [main]

concurrency:
  group: mindcloud-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run end-to-end runtime checks
        run: npm run verify
