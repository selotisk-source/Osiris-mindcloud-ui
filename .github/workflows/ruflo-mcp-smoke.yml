name: RuFlo MCP smoke test

on:
  push:
    branches:
      - "mindcloud/unified-ruflo-osiris-v5"
  workflow_dispatch:

jobs:
  ruflo-mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify RuFlo MCP read-only connectivity
        run: node scripts/verify-ruflo-mcp.mjs
