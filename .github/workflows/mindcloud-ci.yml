name: MindCloud verification

on:
  push:
    branches:
      - main
      - "mindcloud/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mindcloud-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run end-to-end and integration checks
        run: npm run verify
