name: MindCloud CI
on:
  push:
    branches: ["main", "ops/mindcloud-ci-pages-20261030"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run MindCloud verification suite
        run: npm run verify
      - name: Build Cloudflare Pages site
        run: npm run build:pages
      - name: Check Pages output
        run: |
          test -s dist/index.html
          test -s dist/planetary.html
          test -s dist/_redirects
